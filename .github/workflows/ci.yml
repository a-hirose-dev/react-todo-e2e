name: Pull Request Continuous Integration (CI)

on:
    pull_request:
        branches:
            - main
        types: [opened, synchronize, reopened]

jobs:
    build-and-test:
        name: Build & Check & Docker Test
        runs-on: ubuntu-latest

        steps:
            # 1. コードのチェックアウト
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Node.js環境のセットアップ
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            # 3. 依存関係のインストール
            - name: Install dependencies
              run: npm ci

            # 4. リンターによるコード構文チェック
            - name: Run Lint Check
              run: npm run lint

            # 5. TypeScriptの型チェック
            - name: Run Type Check
              run: npx tsc --noEmit

            # 6. アプリのコンパイル（Viteビルド）
            - name: Build Application
              run: npm run build

            # 7. Dockerイメージのビルド検証
            - name: Build Docker Image
              run: |
                  docker build -t task-app:pr-${{ github.event.pull_request.number }} .

            # 8. 作成したDockerコンテナの起動テスト
            - name: Test Docker Container Run
              run: |
                  docker run -d -p 8080:80 --name test-container task-app:pr-${{ github.event.pull_request.number }}
                  sleep 3
                  curl --fail http://localhost:8080 || exit 1
                  docker stop test-container
